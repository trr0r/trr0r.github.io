name: "POC - Publish One Post"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish one pending post
        run: |
          python3 scripts/publish_one.py

      - name: Check changes
        run: |
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Pending posts ==="
          find _pending -maxdepth 1 -type f -name '*.md' -print 2>/dev/null || true

          echo
          echo "=== Published post ==="
          find _posts -maxdepth 1 -type f -name '*-lame.md' -print

      - name: Commit published post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _posts assets/images/posts _pending

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi

          git commit -m "Publish one pending post"
          git push
