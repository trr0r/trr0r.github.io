name: "Daily - Publish One Post"

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: "daily-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish next pending post
        run: |
          python3 scripts/publish_next.py

      - name: Show publication state
        run: |
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Remaining pending articles ==="
          find _pending -maxdepth 1 -type f -name '*.md' -print 2>/dev/null | sort || true

          echo
          echo "=== Published Lame test ==="
          find _posts -maxdepth 1 -type f -name '*-lame.md' -print

      - name: Commit published post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _posts assets/images/posts _pending

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            echo "Probablemente no quedan artículos pendientes."
            exit 0
          fi

          git commit -m "Publish daily post"
          git push
